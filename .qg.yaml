presets: [js]
ruleModules:
  - "@slop-lab/qg-rules-biome"
  - "@slop-lab/qg-rules-cspell"
  - "./scripts/qg-rules.mjs"

scan:
  defaultMode: changed

artifacts:
  generated:
    include: ["**/*.tgz"]

rules:
  external/biome:
    severity: error
    options:
      mode: format
  package/allowed-name:
    severity: error
    message: "패키지 이름의 경우 publish 대상은 @slop-lab/qg 또는 @slop-lab/qg-*, 로컬 전용은 @this-project/...를 사용하세요."
    options:
      allowedPatterns: ["@slop-lab/qg(-.*)?", "@this-project/[^/]+"]
  git/no-tracked-local-files: error
  external/cspell:
    severity: error
    options:
      configFile: cspell.json
      files: ["**/*.md", "packages/**/*.ts", "scripts/*.mjs", "tsdown.config.ts"]
  docs/valid-reference: error
  files/allowed-name:
    severity: error
    options:
      files: ["packages/**/*.ts", "scripts/*.mjs"]
      allowedPatterns: ['[a-z0-9]+(-[a-z0-9]+)*(\.test)?\.(ts|mjs)']
  files/allowed-path:
    severity: error
    options:
      files: ["packages/**/*.ts"]
      allowedPatterns: ['packages/[a-z0-9-]+/src/([a-z0-9-]+/)*[a-z0-9-]+(\.test)?\.ts']
  files/required-companions:
    severity: error
    options:
      directories: ["packages/*"]
      policies:
        - when:
            allOf: ["package.json"]
          files: ["README.md", "LICENSE", "tsconfig.json"]
  project/public-package: error
  test/no-directory-fixture-copy: error

hooks:
  preCommit:
    installation: auto

checks:
  - name: biome-check
    type: command
    command: node
    args: [node_modules/@biomejs/biome/bin/biome, check, .]
    message: "Biome 검사에 실패했습니다. pnpm exec biome check .로 확인하세요."
  - name: build
    type: command
    command: node
    args: [scripts/run-task.mjs, build]
    message: "빌드·타입 검사를 통과해야 합니다. just build로 확인하세요."
  - name: node-test
    type: node-test
    files: ["packages/*/dist/**/*.test.js", "scripts/*.test.mjs"]
    message: "테스트를 통과해야 커밋할 수 있습니다. just test로 확인하세요."
