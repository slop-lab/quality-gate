scan:
  defaultMode: changed

rules:
  git/no-tracked-local-files: error
  # Enable this in a nested docs directory after existing references are reviewed.
  docs/valid-reference: off
  files/max-bytes:
    severity: error
    options:
      limit: 1000000
      ignoredPaths:
        - "**/package-lock.json"
        - "**/pnpm-lock.yaml"
        - "**/yarn.lock"
        - "**/*.tsbuildinfo"
  files/max-line-length:
    severity: error
    options:
      limit: 500
      ignoredPaths:
        - "**/package-lock.json"
        - "**/pnpm-lock.yaml"
        - "**/yarn.lock"
        - "**/*.tsbuildinfo"
  files/max-lines:
    severity: error
    options:
      limit: 5000
      ignoredPaths:
        - "**/package-lock.json"
        - "**/pnpm-lock.yaml"
        - "**/yarn.lock"
        - "**/*.tsbuildinfo"
